    Experience:
      - name: University of Chicago Booth School of Business
        position: Research Collaborator, Agentic Supply Chain Laboratory
        location: Chicago, IL
        startDate: 2026-10-01
        endDate: Present
        summary: Do unequal AI capabilities shift bargaining power in multi-tier supply chains?
        highlights:
          - "Developed an identification control that holds role instructions fixed across a 4-tier economy, isolating capability effects from differences in prompt wording."
          - "Translated each firm's permitted observations and operating constraints into an executable policy that adapts to its network position without exposing hidden state."
          - "Contributed 5 commits and regression tests. The profile passed 152 tests in 6 continuous integration checks across 3 Python environments."
      - name: Columbia Business School, Decision, Risk, and Operations
        position: Research Assistant
        location: New York, NY
        startDate: 2026-06-01
        endDate: 2026-09-01
        summary: Does team membership change how AI agents aggregate the same private information?
        highlights:
          - "Designed 20 matched deliberations with 5 AI agents. Each of 5 private signal environments was replayed across 4 rosters while the task and signal allocation remained fixed."
          - "Preserved every private report and public message before converting each run into 24 measures of deliberation and choice. Reproduced 9 comparable measures for 70 human groups."
          - "Final city choices differed across rosters in 4 of 5 matched signal environments. The pattern shows why team composition belongs inside the mechanism."
      - name: University of Chicago Booth School of Business
        position: Research Assistant
        location: Chicago, IL
        startDate: 2026-06-01
        endDate: Present
        summary: Are negative reviews more precise and more useful for identifying quality than positive reviews?
        highlights:
          - "Reconstructed 3 preregistered experiments with 977 participants from the preregistration materials and raw data."
          - "Reproduced 20 reported results through independent R and Python pipelines and added a text analysis of 468 reviews."
          - "Negative reviews produced 3.10 correct quality judgments out of 5 compared with 2.85 for positive reviews, even though 66% of 294 participants chose positive reviews."
      - name: King's College London
        position: Undergraduate Researcher, B.Sc. Dissertation
        location: London, UK
        startDate: 2024-09-01
        endDate: 2025-05-01
        summary: Does group stability sustain cooperation more reliably than peer punishment or institutional enforcement?
        highlights:
          - "Harmonized an online study with a controlled public goods experiment into 12,059 comparable observations."
          - "Estimated pooled OLS and interaction models, then tested the result through 4 alternative specifications with HC3 and bootstrap inference."
          - "Group stability was associated with 29.25 percentage points more cooperation. Institutional enforcement was moderately positive, while peer punishment had no standalone association."

    Working Papers:
      - bullet: "**Language Monitoring and Automated Enforcement in Public Goods Games.** Designed a randomized comparison across 60 blocks and 180 fresh openings. Adding a language-triggered enforcement channel reduced first-3-round group earnings by 16.45% relative to a recording-only monitor, before punishment was available. The comparison identifies the effect of the announced arrangement. The roles of own-message control and an additional enforcement route remain to be separated."
      - bullet: "**News Metadata and Market Volatility Around FOMC Meetings.** Built distributed TF-IDF processing for more than 2 million GDELT metadata records around an 88-meeting calendar. The writing sample uses 33 meetings, 5 strictly later returns, HC3 OLS, and 20,000 permutations across 7 archived dates."

