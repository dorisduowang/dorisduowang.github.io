- title: FOMC Media Alignment
  field: Financial economics
  topic: markets
  figure: fomc
  description: This project with Yuzhao (Jerry) Jin asks whether news metadata around a Fed meeting contains information about later market volatility. The chart shows an earlier 33-meeting analysis. The latest branch extends the event calendar and separates exploratory timing from holdout validation.
  url: https://github.com/dorisduowang/fomc-media-alignment/tree/analysis/temporal-validation
  link: View the latest project
  baseline_source: https://github.com/dorisduowang/fomc-media-alignment/blob/e15061c6b4b37308295d836f40da722e0752bd6b/results/tables/leadlag_profile.csv
  lags:
    - day: "−3"
      label: 3 days before the meeting
      r: 0.5317738982122637
      explanation: News similarity to the minutes had the second strongest association with later volatility among the 7 days shown.
    - day: "−2"
      label: 2 days before the meeting
      r: 0.5649391361568665
      primary: true
      explanation: The association peaked at 0.56, compared with 0.39 on the meeting day.
    - day: "−1"
      label: 1 day before the meeting
      r: 0.3898334150280286
      explanation: News similarity to the minutes and later volatility moved together less strongly than at day −2.
    - day: "0"
      label: Meeting day
      r: 0.39231167375372344
      explanation: On the meeting day, news that more closely resembled the later minutes was associated with higher volatility afterward.
    - day: "+1"
      label: 1 day after the meeting
      r: 0.44074209894652233
      explanation: This was the strongest association among the 3 days after the meeting.
    - day: "+2"
      label: 2 days after the meeting
      r: 0.2228976855872419
      explanation: This was the weakest association among the 7 days shown.
    - day: "+3"
      label: 3 days after the meeting
      r: 0.32394957181615747
      explanation: The association with volatility was stronger than at day +2 and weaker than at day +1.
- title: Agentic Supply Chains
  field: Operations and bargaining
  topic: operations
  group: core
  figure: supply-chain
  caption: Study design · Hold firm roles fixed and vary agent capability.
  fact: 4 tiers
  fact_label: connected market roles
  description: I test whether unequal AI capabilities shift bargaining power across a multi-tier supply chain when every firm keeps the same role and information boundary.
  url: /projects/agentic_supply_chains/
  link: Read the study design
  details:
    question: When firms use agents of unequal capability, who captures the surplus and where does coordination fail?
    data: The experiment records decisions across a 4-tier economy while preserving each firm's permitted observations and operating constraints.
    methods: I hold role instructions fixed, vary agent capability, and compare prices, quantities, agreement, and surplus across network positions.
- title: Which Reviews Identify Quality?
  field: Information and behavioral economics
  topic: information
  group: core
  figure: reviews
  caption: Study design · Separate what readers prefer from what helps them identify quality.
  fact: 977
  fact_label: participants across 3 experiments
  description: I study whether the reviews people prefer are also the reviews that contain the most useful evidence about product quality.
  url: /projects/review_information/
  link: Read the research summary
  details:
    question: Are negative reviews more precise and more useful for identifying quality than positive reviews?
    data: Three preregistered experiments include 977 participants and 468 review texts.
    methods: I reconstructed the reported analyses, compared independent R and Python pipelines, and measured linguistic evidence in each review.
- title: Auditing Text-Based Reward Signals
  field: AI and science
  topic: ai
  group: earlier
  figure: chorus
  caption: Study design · Papers, researchers, and concepts feed a ranking.
  fact: "443"
  fact_label: publications audited
  description: I examined how alternative reward signals change which papers an AI research system surfaces.
  url: /projects/chorus_audit/
  link: Read the project
  details:
    question: Can rewards for surprising language help an AI system surface high-impact scientific papers?
    data: The course audit covered 443 publications, with links to researcher profiles and scientific concepts.
    methods: I built a directed hypergraph and simulated three researcher personas, then compared ranking stability and the recovery of high-impact papers across reward rules.
- title: Cooperation in Large-Scale Repeated Games
  field: Experimental economics
  topic: cooperation
  group: core
  figure: cooperation
  caption: Study design · Track fixed and regrouped players across rounds.
  fact: "12,059"
  fact_label: harmonized observations
  description: My King's College London dissertation asks when peer punishment can sustain cooperation as groups change over time.
  url: /projects/kcl_dissertation/
  link: Read the dissertation summary
  details:
    question: How do group stability, peer punishment, and institutional enforcement shape contributions in repeated public goods games?
    data: The pooled dataset contains 12,059 observations drawn from Ikariam game records and a controlled public goods experiment.
    methods: I harmonized the two datasets and used pooled regressions with interaction terms and cluster-robust standard errors to compare grouping and enforcement conditions.
- title: Facilitator-Free Digital Twins
  field: Group decision-making
  topic: cooperation
  figure: twins
  caption: Study design · Matched digital twins deliberate and make a group choice.
  fact: GRAIL
  fact_label: public study protocol
  description: I use matched deliberations to isolate whether team membership changes how AI agents aggregate the same private information.
  url: https://github.com/dorisduowang/group_ai_lab/blob/feature/no-facilitator-agent-study/docs/TWIN2K_GRAIL_PROTOCOL.md
  link: Read the protocol
  details:
    question: How does team composition shape what digital twins share and decide in groups without a facilitator?
    data: The completed comparison contains 20 deliberations. Each of 5 private signal environments is replayed across 4 rosters while the task and signal allocation remain fixed.
    methods: I preserve every private report and public message, then compare which facts enter discussion, how participation is distributed, and which city the group chooses.
- title: Gold Forecasting with ARIMA and LSTM
  field: Financial econometrics
  topic: markets
  group: earlier
  figure: gold
  caption: Study design · Compare ARIMA and LSTM forecasts on held-out returns.
  fact: 2000–2020
  fact_label: daily gold price data
  description: I compare whether classical and neural models can forecast gold returns on data they have not seen.
  url: https://doi.org/10.54691/bcpbm.v38i.4123
  link: Read the paper
  details:
    question: How well do ARIMA and LSTM forecast gold returns on unseen data?
    data: Daily US-dollar gold prices from Yahoo Finance from January 2000 through April 2020, with May 1, 2020 held out for forecasting.
    methods: I fitted ARIMA and LSTM under competing specifications and compared forecast errors using mean absolute error and root mean squared error.
- title: Gender Pay and Structural Inequality
  field: Applied microeconomics
  topic: inequality
  group: earlier
  figure: inequality
  caption: Study design · Estimate and diagnose wage models with census microdata.
  fact: OLS
  fact_label: wage regression
  description: An analysis of UK gender pay disparities using census microdata, regression and model diagnostics.
  url: /cv/
  link: See research experience
  details:
    question: How does the estimated UK gender pay gap change after accounting for education and job tenure?
    data: An analytical sample of UK census microdata with wages and worker characteristics.
    methods: I compared the unadjusted pay gap with estimates from multivariable wage regressions and checked for multicollinearity and unequal error variance.
- title: LLM Washing Machine
  field: Mechanistic interpretability
  topic: ai
  group: earlier
  figure: llm
  caption: Study design · Compare “washing machine” with “machine” alone.
  fact: Sparse features
  fact_label: representation analysis
  description: How do language models represent a compound concept such as “washing machine”? I compare it with its head word using similarity and sparse-feature analyses.
  url: https://github.com/dorisduowang/llm-washing-machine-claude/blob/main/REPORT.md
  link: Read the analysis
  details:
    question: Does GPT-2 encode compound concepts like “washing machine” through dedicated features, through their component words, or through both?
    data: Twenty-one hand-curated compounds ranging from transparent phrases to idioms, with matched prompts for their component words.
    methods: I compared GPT-2 Small activations using cosine similarity, measured sparse autoencoder feature overlap, and examined next-token probabilities.
